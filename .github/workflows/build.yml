# Builds the CYD-S3's firmware (the 2.8", the 3.5" and the 4"). Every run keeps it as a "firmware" artifact; tags
# (v0.2) also get a release with it attached. The JC4827W543C's (DIY) is released too, but not on the installer page. (The case's STLs are made on the installer page, from
# case/fm1buddy-case.scad.)
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio esptool==4.8.1
      - run: tools/unit-test.sh
      # the FM-1's flash loader (loader/): its tests, and that it builds (its bytes are in src/app/mflr_loader.h; a
      # build differs by a few bytes of padding from host to host, so they aren't compared)
      - run: loader/test.sh
      - uses: actions/cache@v4
        with:
          path: ~/pi32v2
          key: pi32v2-toolchain-23.1.5-2
      - name: the loader's toolchain (pi32v2)
        run: |
          if [ ! -e ~/pi32v2/bin/clang ]; then
            curl -fL --retry 3 -o /tmp/pi32v2.tar.xz https://github.com/jvitkauskas/pi32v2-llvm/releases/download/pi32v2-23.1.5-2/pi32v2-llvm-23.1.5-2-linux-x64.tar.xz
            mkdir -p ~/pi32v2 && tar -xJf /tmp/pi32v2.tar.xz -C ~/pi32v2 --strip-components=1
          fi
      - run: cp src/app/mflr_loader.h /tmp/ && PI32V2_TOOLCHAIN=~/pi32v2 loader/build.sh && cp /tmp/mflr_loader.h src/app/
      # PlatformIO's platforms and toolchains (GitHub release downloads): kept, so a slow GitHub doesn't fail the build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-
      # Settings > About shows it: the tag on a release, else the commit
      - run: pio run -e cyd-s3 -e cyd-s3-35 -e cyd-s3-4 -e jc4827w543c
        env:
          PLATFORMIO_BUILD_FLAGS: -DFM1BUDDY_VERSION=\"${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}\"
      - run: |
          mkdir -p build
          cp .pio/build/cyd-s3/firmware.factory.bin build/fm1buddy-cyd-s3.bin
          cp .pio/build/cyd-s3-35/firmware.factory.bin build/fm1buddy-cyd-s3-35.bin
          cp .pio/build/cyd-s3-4/firmware.factory.bin build/fm1buddy-cyd-s3-4.bin
          cp .pio/build/jc4827w543c/firmware.factory.bin build/fm1buddy-jc4827w543c.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/fm1buddy-cyd-s3.bin
            build/fm1buddy-cyd-s3-35.bin
            build/fm1buddy-cyd-s3-4.bin
            build/fm1buddy-jc4827w543c.bin
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build/fm1buddy-cyd-s3.bin
            build/fm1buddy-cyd-s3-35.bin
            build/fm1buddy-cyd-s3-4.bin
            build/fm1buddy-jc4827w543c.bin
          fail_on_unmatched_files: true
